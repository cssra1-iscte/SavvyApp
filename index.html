<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Savvy</title>
  <meta name="description" content="Gastos mensais, estatísticas e objetivos de poupança — offline, sem login.">
  <meta name="theme-color" content="#EEF0FB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Savvy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-blob b1"></div><div class="bg-blob b2"></div>

  <div class="shell">
    <!-- Sidebar (desktop) -->
    <aside class="sidebar glass">
      <div class="logo"><span class="logo-mark"><i></i><i></i><i></i></span>savvy</div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-card">
        <div class="side-illu">💡</div>
        <b>Cópia de segurança</b>
        <small>Os dados ficam só neste dispositivo</small>
        <button class="btn primary" data-action="export">Exportar</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="logo mobile-only"><span class="logo-mark"><i></i><i></i><i></i></span>savvy</div>
        <div class="month-switch glass">
          <button data-action="prev-month" aria-label="Mês anterior">‹</button>
          <span id="monthLabel"></span>
          <button data-action="next-month" aria-label="Mês seguinte">›</button>
        </div>
        <button class="icon-btn glass desktop-only" data-action="add" aria-label="Adicionar">＋</button>
      </header>
      <h1 id="viewTitle"></h1>
      <section id="view"></section>
    </main>

    <!-- Right column (desktop dashboard) -->
    <aside class="rightcol glass" id="rightcol"></aside>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav glass" id="bottomNav"></nav>

  <!-- Sheet / modal -->
  <div class="sheet-backdrop" id="backdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
